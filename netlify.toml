[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# No build command — plain static HTML site

# Open Vault retired — permanently redirect its old URL to Key Keepers
[[redirects]]
  from = "/open-vault.html"
  to = "/keykeepers.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Form submissions are handled via Netlify Forms (data-netlify="true")
# Configure email notifications at:
# Netlify Dashboard → Site → Forms → Form notifications → Add notification
